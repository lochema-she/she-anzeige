[workspace]
members = [
    "qitech_control",
    "control-core",
    "machine_implementations",
]
exclude = ["vendor/qitech_lib"]
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"

[workspace.dependencies]
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="54eafc96a298b8959436ce02cb19d31a93a27dfb" }

[workspace.lints.clippy]
# don't lint poissbilities for let chains because they were introduces after Rust 1.86
collapsible_if = "allow"

# Lint groups (priority -1)
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pendantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Local fixes to qitech_lib (WAGO 750-430 input offset, 750-354 PDO mapping loop).
# Remove once they are merged upstream.
[patch."https://github.com/qitechgmbh/qitech_lib.git"]
qitech_lib = { path = "vendor/qitech_lib" }
